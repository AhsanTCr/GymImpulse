name: Build Gymimpulse APK

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 build-tools;35.0.0 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Configure Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > /tmp/google-services.json 2>/dev/null \
              && python3 -m json.tool /tmp/google-services.json >/dev/null 2>&1; then
              cp /tmp/google-services.json app/google-services.json
              echo "Configured app/google-services.json from base64 GOOGLE_SERVICES_JSON secret."
            elif printf '%s' "$GOOGLE_SERVICES_JSON" > /tmp/google-services.json \
              && python3 -m json.tool /tmp/google-services.json >/dev/null 2>&1; then
              cp /tmp/google-services.json app/google-services.json
              echo "Configured app/google-services.json from raw GOOGLE_SERVICES_JSON secret."
            else
              echo "::error::GOOGLE_SERVICES_JSON secret is set, but it is neither valid JSON nor valid base64-encoded JSON."
              exit 1
            fi
          elif [ -f "app/google-services.json" ]; then
            echo "Using repository app/google-services.json."
          else
            echo "::warning::app/google-services.json is missing and secrets.GOOGLE_SERVICES_JSON is not set. The APK will build, but Google Sign-In and Firestore will show 'Firebase is not configured for this build' until you add the GOOGLE_SERVICES_JSON secret in GitHub."
          fi

      - name: Build APK with Gradle
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gymimpulse-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
